name: Build CaptionN DeepL APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Placeholder google-services.json
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.charles.livecaptionn.deepl" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "ci-placeholder" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: local.properties (no ads)
        run: |
          cat > local.properties <<'PROPS'
          translate.url=http://localhost:3006
          stt.url=http://localhost:9000/asr?output=json
          ads.enabled=false
          PROPS

      - name: Build APK
        run: chmod +x gradlew && ./gradlew assembleGithubDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/github/debug/app-github-debug.apk CaptionN-DeepL.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: CaptionN DeepL v1.${{ github.run_number }}
          body: LiveCaptionN + DeepL çeviri motoru. APK dosyasını AYN Thor'a indirip kurun.
          files: CaptionN-DeepL.apk
          make_latest: true
